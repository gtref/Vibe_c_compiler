# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# Build documentation in the following order:
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

# Optimize build speed by only building what's changed
# (Optional but recommended)
# build:
#   jobs:
#     post_checkout:
#       - git fetch --unshallow || true

# Configuration for Python dependencies
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
      extra_requirements:
        - docs

# Documentation framework settings
# Change 'mkdocs' to 'sphinx' if you prefer Sphinx
mkdocs:
  configuration: mkdocs.yml

# Explicitly list formats to build
formats:
  - pdf
  - epub
